name: Publish Skill to ClawHub

on:
  push:
    tags:
      - 'v*' # 仅在推送版本号 Tag 时触发发布

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ClawHub CLI
        run: npm install --global clawhub

      - name: Authenticate with ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        # 使用 --no-browser 标志以及 Token 进行无头登录
        run: clawhub auth login --token "${CLAWHUB_TOKEN}" --no-browser

      # 解决 CLI 扫描 Bug
      - name: Remove .git directory (Workaround)
        run: rm -rf .git

      - name: Publish Skill
        env:
          # github.ref_name 会捕获触发当前 run 的 tag，例如 "v0.2.2"
          GIT_TAG: ${{ github.ref_name }}
        run: |
          # 使用 Bash 字符串截取，去掉开头的 'v'，得到 "0.2.2"
          VERSION=${GIT_TAG#v}
          echo "Preparing to publish version: ${VERSION} for sjtu-slurm-skill"
          clawhub publish . --slug sjtu-slurm-skill --tags latest --version "${VERSION}"